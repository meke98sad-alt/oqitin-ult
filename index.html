<!doctype html>
<html lang="kk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Оқитын ұлт — тренажёр</title>
<style>
:root{
  --bg:#f6f3ee; --card:#ffffff; --ink:#1f2328; --muted:#6b6f76; --line:#e4dfd6;
  --accent:#2f6f5e; --accent-ink:#fff; --soft:#e8f1ee;
  --ok:#2e8b57; --ok-soft:#e3f4ea; --bad:#c0392b; --bad-soft:#fbe7e4; --mid:#d08a1f;
  --l1:#3a8f6b; --l2:#d08a1f; --l3:#b8433a;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#16181b; --card:#1f2226; --ink:#eceae6; --muted:#9aa0a6; --line:#33373c;
    --accent:#5bb69b; --accent-ink:#0f1412; --soft:#21302b;
    --ok:#5cc98b; --ok-soft:#1d3327; --bad:#ef7b6e; --bad-soft:#3a2220; --mid:#e3a64a;
  }
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:760px;margin:0 auto;padding:16px 16px 60px}
h1{font-size:24px;margin:4px 0 2px;font-weight:800}
h2{font-size:18px;margin:0 0 10px}
.sub{color:var(--muted);margin:0 0 16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:14px}
.hidden{display:none!important}
button{font:inherit;cursor:pointer;border:0;border-radius:12px}
.btn{background:var(--accent);color:var(--accent-ink);padding:14px 20px;font-weight:600;font-size:17px}
.btn:disabled{opacity:.45;cursor:default}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grow{flex:1}

.tabs{display:flex;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:5px;margin:12px 0 16px}
.tabs button{flex:1;padding:10px;background:transparent;color:var(--muted);font-weight:600}
.tabs button.on{background:var(--accent);color:var(--accent-ink)}

.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{padding:9px 14px;border:1px solid var(--line);border-radius:999px;background:var(--card);color:var(--ink)}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.label{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:16px 0 8px}
.label:first-child{margin-top:0}
.note{font-size:14px;color:var(--muted)}

.books{display:grid;gap:8px}
.book{display:flex;gap:12px;align-items:center;padding:12px;border:2px solid var(--line);border-radius:12px;cursor:pointer;background:var(--card);color:var(--ink);text-align:left;width:100%}
.book.on{border-color:var(--accent);background:var(--soft)}
.book .t{font-weight:600}
.book .a{color:var(--muted);font-size:14px}
.book .meter{margin-left:auto;text-align:right;font-size:13px;color:var(--muted);min-width:76px}
.bar{height:6px;background:var(--line);border-radius:4px;overflow:hidden;margin-top:4px}
.bar i{display:block;height:100%;background:var(--accent)}

.top{display:flex;justify-content:space-between;align-items:center;font-size:14px;color:var(--muted);margin-bottom:8px}
.progress{height:8px;background:var(--line);border-radius:6px;overflow:hidden;margin-bottom:16px}
.progress i{display:block;height:100%;background:var(--accent);transition:width .3s}
.tag{display:inline-block;font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;color:#fff;margin-right:6px}
.tag.l1{background:var(--l1)}.tag.l2{background:var(--l2)}.tag.l3{background:var(--l3)}
.bookname{font-size:14px;color:var(--muted)}
.q{font-size:20px;font-weight:600;margin:12px 0 16px}
.opts{display:grid;gap:10px}
.opt{text-align:left;background:var(--card);color:var(--ink);border:2px solid var(--line);padding:14px 16px;font-size:17px;display:flex;gap:12px;align-items:flex-start}
.opt b{color:var(--muted);min-width:18px}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt.ok{border-color:var(--ok);background:var(--ok-soft)}
.opt.bad{border-color:var(--bad);background:var(--bad-soft)}
.opt:disabled{cursor:default}
.expl{margin-top:14px;padding:12px 14px;border-radius:12px;background:var(--soft);font-size:15px}
.timer{font-weight:700;color:var(--ink)}
.timer.low{color:var(--bad)}

.big{font-size:56px;font-weight:800;margin:0;line-height:1}
.mist{border-top:1px solid var(--line);padding:12px 0}
.mist:first-child{border-top:0}
.mist .yours{color:var(--bad)}
.mist .right{color:var(--ok);font-weight:600}

/* аналитика */
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;text-align:center}
.kpi b{display:block;font-size:26px;font-weight:800}
.kpi span{font-size:13px;color:var(--muted)}
.arow{display:grid;grid-template-columns:1fr 120px 52px;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.arow:first-of-type{border-top:0}
.arow .n{font-weight:600}
.arow .s{font-size:13px;color:var(--muted);font-weight:400}
.arow .p{text-align:right;font-weight:700}
.hbar{height:10px;background:var(--line);border-radius:6px;overflow:hidden}
.hbar i{display:block;height:100%}
.lvls{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:6px}
.lvls div{font-size:12px;color:var(--muted);background:var(--bg);border-radius:8px;padding:4px 6px;text-align:center}
.hist{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:15px}
.hist:first-of-type{border-top:0}
.hist .d{color:var(--muted);font-size:13px}
.wq{padding:10px 0;border-top:1px solid var(--line)}
.wq:first-of-type{border-top:0}
.wq .c{font-size:13px;color:var(--bad);font-weight:600}
.tip{background:var(--soft);border-radius:12px;padding:12px 14px;margin-bottom:14px;font-size:15px}
footer{text-align:center;font-size:13px;color:var(--muted);margin-top:24px}
@media (max-width:480px){ .arow{grid-template-columns:1fr 70px 44px} .kpi b{font-size:22px} }
</style>
</head>
<body>
<div class="wrap">
  <h1>Оқитын ұлт</h1>
  <p class="sub" style="margin:0">Байқауға дайындық тренажёры</p>

  <div class="tabs" id="tabs">
    <button class="on" data-t="home">Тест</button>
    <button data-t="stats">Аналитика</button>
  </div>

  <!-- БАСТЫ БЕТ -->
  <section id="home">
    <div class="card">
      <div class="label">Тест түрі</div>
      <div class="chips" id="kinds">
        <button class="chip" data-v="all">Жалпы тест (барлық кітап)</button>
        <button class="chip" data-v="book">Кітап бойынша</button>
      </div>
      <div id="bookPick" class="hidden">
        <div class="label">Кітапты таңдаңыз</div>
        <div class="books" id="books"></div>
      </div>
      <div class="label">Қиындық деңгейі</div>
      <div class="chips" id="levels">
        <button class="chip" data-v="0">Аралас</button>
        <button class="chip" data-v="1">Жеңіл</button>
        <button class="chip" data-v="2">Орташа</button>
        <button class="chip" data-v="3">Күрделі</button>
      </div>
      <div class="label">Режим</div>
      <div class="chips" id="modes">
        <button class="chip" data-v="normal">Қалыпты</button>
        <button class="chip" data-v="mistakes">Қатемен жұмыс</button>
        <button class="chip" data-v="timer">Уақытпен (30 с)</button>
      </div>
      <p class="note" id="poolInfo" style="margin:16px 0 0"></p>
    </div>
    <button class="btn" id="start" style="width:100%">Тестті бастау</button>
  </section>

  <!-- СҰРАҚ -->
  <section id="quiz" class="hidden">
    <div class="top">
      <span id="qnum"></span>
      <span><span id="timer" class="timer"></span> &nbsp; <span id="score"></span></span>
    </div>
    <div class="progress"><i id="prog"></i></div>
    <div class="card">
      <div><span class="tag" id="qlevel"></span><span class="bookname" id="qbook"></span></div>
      <div class="q" id="qtext"></div>
      <div class="opts" id="opts"></div>
      <div class="expl hidden" id="expl"></div>
    </div>
    <div class="row">
      <button class="btn ghost" id="quit">Шығу</button>
      <button class="btn grow" id="next" disabled>Келесі</button>
    </div>
  </section>

  <!-- НӘТИЖЕ -->
  <section id="result" class="hidden">
    <div class="card" style="text-align:center">
      <p class="big" id="rScore"></p>
      <p class="sub" id="rText" style="margin:10px 0 0"></p>
    </div>
    <div class="card" id="rMistakesCard">
      <h2>Қателер</h2>
      <div id="rMistakes"></div>
    </div>
    <div class="row">
      <button class="btn grow" id="again">Жаңа нұсқа</button>
      <button class="btn ghost" id="toHome">Басты бет</button>
    </div>
  </section>

  <!-- АНАЛИТИКА -->
  <section id="stats" class="hidden">
    <div class="kpis">
      <div class="kpi"><b id="kTests">0</b><span>өткен тест</span></div>
      <div class="kpi"><b id="kAns">0</b><span>жауап</span></div>
      <div class="kpi"><b id="kPct">—</b><span>дұрыс жауап</span></div>
    </div>
    <div class="tip hidden" id="tip"></div>
    <div class="card">
      <h2>Кітаптар бойынша</h2>
      <div id="aBooks"></div>
    </div>
    <div class="card">
      <h2>Қиындық деңгейі бойынша</h2>
      <div id="aLevels"></div>
    </div>
    <div class="card">
      <h2>Жиі қателесетін сұрақтар</h2>
      <div id="aWrong"></div>
    </div>
    <div class="card">
      <h2>Соңғы тесттер</h2>
      <div id="aHist"></div>
    </div>
    <button class="btn ghost" id="reset" style="width:100%">Статистиканы өшіру</button>
  </section>

  <footer>Статистика тек осы құрылғыдағы браузерде сақталады.</footer>
</div>

<script>
window.BOOKS = []; window.QUESTIONS = [];
function addBook(book, items){
  window.BOOKS.push(book);
  items.forEach(it => window.QUESTIONS.push({b: book.id, l: it[0], q: it[1], a: it.slice(2, 6), e: it[6] || ''}));
}
</script>

[3,"Уинстон О'Брайеннен «Үлкен Аға шын бар ма?» деп сұрағанда, О'Брайен не деді?","Ол — Партияның бейнесі, ол бар","Жоқ, ол ойдан шығарылған","Ол баяғыда өлген","Білмеймін, мен оны көрмегенмін"],

[3,"Уинстон мен Джулия бірінші кездесуге қай жерде келісті?","Жеңіс алаңында","Метрода, адам көп кезде","Министрлік асханасында","Чаррингтонның дүкенінде"],
[3,"Джулияның Партияға наразылығы Уинстоннан қалай ерекшеленеді?","Идеологияға емес, тыйымдарға қарсы","Ол көтеріліс дайындап жүрген","Ол Голдстейнді жақтайды","Ол Партияға мүлде наразы емес"],
[3,"Романның басты философиялық ойы қандай?","Билік ойды да басқарып, адамды жоя алады","Махаббат бәрін жеңеді","Ғылым мен техника бәрін шешеді","Соғыс — адамзатқа пайдалы"],
[3,"«Үлкен Аға», «Ойполиция», «Қосойлау», «101-бөлме» сөздерінің тағдыры қандай болды?","Көп тілге тұрақты тіркес болып енді","Ұмытылып, ешкім білмейді","Көп елдерде тыйым салынды","Тек ағылшын тілінде қалды"],
[3,"«Оруэллдік» (Orwellian) сөзі нені білдіреді?","Тотальді бақылау жүйесін","Бақытты, тең құқықты қоғамды","Ағылшын әдебиетінің стилін","Ауыл өмірін суреттеуді"]

</script>
<script>
(() => {
  const $ = id => document.getElementById(id);
  const BOOKS = window.BOOKS, QS = window.QUESTIONS.map(q => ({...q, id: q.b + '|' + q.q}));
  const qById = Object.fromEntries(QS.map(q => [q.id, q]));
  const LEVEL = {1:'Жеңіл', 2:'Орташа', 3:'Күрделі'};
  const N = 20;
  const bookById = Object.fromEntries(BOOKS.map(b => [b.id, b]));
  const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

  // ---------- сақтау ----------
  const KEY = 'on_stats_v1', HIST = 'on_hist_v1', PREF = 'on_prefs_v1';
  const load = (k, d) => { try { return JSON.parse(localStorage.getItem(k)) || d; } catch { return d; } };
  const save = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} };
  let stats = load(KEY, {});      // id -> {r, w, t, last}
  let hist = load(HIST, []);      // [{d, kind, book, r, n}]
  const prefs = Object.assign({kind:'all', book: BOOKS[0] && BOOKS[0].id, level:0, mode:'normal'}, load(PREF, {}));
  if (!bookById[prefs.book]) prefs.book = BOOKS[0] && BOOKS[0].id;

  // ---------- қойындылар ----------
  const show = id => ['home','quiz','result','stats'].forEach(s => $(s).classList.toggle('hidden', s !== id));
  $('tabs').querySelectorAll('button').forEach(b => b.onclick = () => {
    clearInterval(tick);
    $('tabs').querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b));
    if (b.dataset.t === 'stats') renderStats(); else renderHome();
    show(b.dataset.t);
  });
  const setTab = t => $('tabs').querySelectorAll('button').forEach(x => x.classList.toggle('on', x.dataset.t === t));

  // ---------- басты бет ----------
  function bookPct(id){
    let r = 0, t = 0;
    QS.forEach(q => { if (q.b === id && stats[q.id]) { r += stats[q.id].r; t += stats[q.id].r + stats[q.id].w; } });
    return {r, t, pct: t ? Math.round(r / t * 100) : null};
  }
  function renderHome(){
    $('bookPick').classList.toggle('hidden', prefs.kind !== 'book');
    $('books').innerHTML = BOOKS.map(b => {
      const n = QS.filter(q => q.b === b.id).length, s = bookPct(b.id);
      return `<button class="book ${prefs.book === b.id ? 'on' : ''}" data-id="${b.id}">
        <div><div class="t">${esc(b.title)}</div><div class="a">${esc(b.author)} · ${n} сұрақ</div></div>
        <div class="meter">${s.pct === null ? 'басталмаған' : s.pct + '% дұрыс'}<div class="bar"><i style="width:${s.pct || 0}%"></i></div></div>
      </button>`;
    }).join('');
    $('books').querySelectorAll('.book').forEach(el => el.onclick = () => { prefs.book = el.dataset.id; save(PREF, prefs); renderHome(); });
    chipGroup('kinds', 'kind', String); chipGroup('levels', 'level', Number); chipGroup('modes', 'mode', String);
    updateInfo();
  }
  function chipGroup(id, key, cast){
    $(id).querySelectorAll('.chip').forEach(c => {
      c.classList.toggle('on', String(prefs[key]) === c.dataset.v);
      c.onclick = () => { prefs[key] = cast(c.dataset.v); save(PREF, prefs); renderHome(); };
    });
  }
  function pool(){
    return QS.filter(q => (prefs.kind === 'all' || q.b === prefs.book)
      && (prefs.level === 0 || q.l === prefs.level)
      && (prefs.mode !== 'mistakes' || (stats[q.id] && stats[q.id].last === 0)));
  }
  function updateInfo(){
    const p = pool().length, n = Math.min(p, N);
    $('poolInfo').textContent = prefs.mode === 'mistakes'
      ? (p ? `Қате жіберілген сұрақтар: ${p}. Нұсқада ${n} сұрақ болады.` : 'Әзірге қате жоқ — алдымен қалыпты тест тапсырыңыз.')
      : `Базада сәйкес сұрақтар: ${p}. Нұсқада ${n} сұрақ болады.`;
    $('start').disabled = n === 0;
  }

  // ---------- нұсқа құрастыру ----------
  // Жаңа және қате жіберілген сұрақтар жиірек шығады, жуырда дұрыс жауап берілгендері — сирек, бірақ қайталанады.
  function weight(q){
    const s = stats[q.id];
    if (!s) return 4;
    let w = s.last === 0 ? 5 : 1;
    w += s.w * 0.7;
    if (s.last === 1 && (Date.now() - s.t) < 6 * 36e5) w *= 0.3;
    return w;
  }
  const pickWeighted = (list, n) => list.map(q => ({q, k: Math.pow(Math.random(), 1 / weight(q))}))
    .sort((a, b) => b.k - a.k).slice(0, n).map(x => x.q);
  function shuffle(a){ for (let i = a.length - 1; i > 0; i--){ const j = Math.random() * (i + 1) | 0; [a[i], a[j]] = [a[j], a[i]]; } return a; }

  function buildTest(){
    const p = pool(), n = Math.min(p.length, N);
    let picked = [];
    if (prefs.mode === 'mistakes') picked = pickWeighted(p, n);
    else if (prefs.kind === 'all'){
      // жалпы тест: кітаптарға тең бөлінеді (20 / 5 = әрқайсысынан 4)
      const ids = shuffle(BOOKS.map(b => b.id).filter(id => p.some(q => q.b === id)));
      const per = Math.floor(n / ids.length), extra = n % ids.length;
      ids.forEach((id, i) => picked.push(...pickByLevel(p.filter(q => q.b === id), per + (i < extra ? 1 : 0))));
    } else picked = pickByLevel(p, n);
    picked = picked.slice(0, n);
    if (prefs.level === 0 && prefs.mode !== 'mistakes') picked.sort((a, b) => a.l - b.l || Math.random() - .5);
    else shuffle(picked);
    return picked.map(q => ({...q, opts: shuffle(q.a.map((t, i) => ({t, right: i === 0})))}));
  }
  function pickByLevel(list, n){
    if (prefs.level !== 0) return pickWeighted(list, n);
    const share = {1: .4, 2: .35, 3: .25}, out = [];
    for (const l of [1, 2, 3]) out.push(...pickWeighted(list.filter(q => q.l === l), Math.round(n * share[l])));
    out.push(...pickWeighted(list.filter(q => !out.includes(q)), n - out.length));
    return out.slice(0, n);
  }

  // ---------- тест ----------
  let test = [], idx = 0, right = 0, answers = [], tick = null;
  function start(){
    test = buildTest(); idx = 0; right = 0; answers = [];
    if (!test.length) return;
    show('quiz'); renderQ();
  }
  function renderQ(){
    const q = test[idx];
    $('qnum').textContent = `Сұрақ ${idx + 1} / ${test.length}`;
    $('score').textContent = `Дұрыс: ${right}`;
    $('prog').style.width = (idx / test.length * 100) + '%';
    $('qlevel').className = 'tag l' + q.l; $('qlevel').textContent = LEVEL[q.l];
    $('qbook').textContent = bookById[q.b].title;
    $('qtext').textContent = q.q;
    $('opts').innerHTML = q.opts.map((o, i) => `<button class="opt"><b>${'ABCD'[i]}</b><span>${esc(o.t)}</span></button>`).join('');
    $('opts').querySelectorAll('.opt').forEach((b, i) => b.onclick = () => answer(i));
    $('expl').classList.add('hidden');
    $('next').disabled = true;
    $('next').textContent = idx === test.length - 1 ? 'Нәтиже' : 'Келесі';
    startTimer();
  }
  function startTimer(){
    clearInterval(tick); $('timer').textContent = '';
    if (prefs.mode !== 'timer') return;
    let left = 30;
    const draw = () => { $('timer').textContent = '⏱ ' + left; $('timer').classList.toggle('low', left <= 5); };
    draw();
    tick = setInterval(() => { left--; draw(); if (left <= 0){ clearInterval(tick); answer(-1); } }, 1000);
  }
  function answer(i){
    const q = test[idx], btns = $('opts').querySelectorAll('.opt');
    if (!btns.length || btns[0].disabled) return;
    clearInterval(tick);
    const ok = i >= 0 && q.opts[i].right;
    btns.forEach((b, j) => { b.disabled = true; if (q.opts[j].right) b.classList.add('ok'); });
    if (!ok && i >= 0) btns[i].classList.add('bad');
    if (ok) right++;
    answers.push({q, chosen: i >= 0 ? q.opts[i].t : '(уақыт бітті)', ok});
    const s = stats[q.id] || {r: 0, w: 0};
    ok ? s.r++ : s.w++; s.last = ok ? 1 : 0; s.t = Date.now();
    stats[q.id] = s; save(KEY, stats);
    $('score').textContent = `Дұрыс: ${right}`;
    if (q.e){ $('expl').textContent = q.e; $('expl').classList.remove('hidden'); }
    $('next').disabled = false; $('next').focus();
  }
  function next(){ if (idx < test.length - 1){ idx++; renderQ(); } else finish(); }
  function finish(){
    clearInterval(tick);
    const pct = Math.round(right / test.length * 100);
    hist.unshift({d: Date.now(), kind: prefs.mode === 'mistakes' ? 'mistakes' : prefs.kind, book: prefs.kind === 'book' ? prefs.book : null, r: right, n: test.length});
    hist = hist.slice(0, 200); save(HIST, hist);
    $('rScore').textContent = `${right} / ${test.length}`;
    $('rText').textContent = `${pct}% дұрыс. ` + (pct >= 90 ? 'Керемет, сіз дайынсыз!' : pct >= 70 ? 'Жақсы, қателерді пысықтау керек.' : pct >= 50 ? 'Жаман емес, қиын жерлерін қайта оқыңыз.' : 'Кітапты қайта оқып, тестті тағы тапсырыңыз.');
    const wrong = answers.filter(a => !a.ok);
    $('rMistakesCard').classList.toggle('hidden', !wrong.length);
    $('rMistakes').innerHTML = wrong.map(a => `<div class="mist">
      <div class="bookname">${esc(bookById[a.q.b].title)}</div>
      <div style="font-weight:600;margin:4px 0">${esc(a.q.q)}</div>
      <div class="yours">Сіздің жауабыңыз: ${esc(a.chosen)}</div>
      <div class="right">Дұрыс жауап: ${esc(a.q.a[0])}</div>
      ${a.q.e ? `<div class="note" style="margin-top:4px">${esc(a.q.e)}</div>` : ''}</div>`).join('');
    show('result');
  }

  // ---------- аналитика ----------
  const color = p => p >= 80 ? 'var(--ok)' : p >= 60 ? 'var(--mid)' : 'var(--bad)';
  function agg(filter){
    let r = 0, w = 0, seen = 0;
    QS.forEach(q => { const s = stats[q.id]; if (s && filter(q)) { r += s.r; w += s.w; seen++; } });
    return {r, w, t: r + w, seen, pct: r + w ? Math.round(r / (r + w) * 100) : null};
  }
  function renderStats(){
    const all = agg(() => true);
    $('kTests').textContent = hist.length;
    $('kAns').textContent = all.t;
    $('kPct').textContent = all.pct === null ? '—' : all.pct + '%';

    const rows = BOOKS.map(b => {
      const total = QS.filter(q => q.b === b.id).length, a = agg(q => q.b === b.id);
      const lv = [1, 2, 3].map(l => agg(q => q.b === b.id && q.l === l));
      return {b, total, a, lv};
    });
    $('aBooks').innerHTML = rows.map(({b, total, a, lv}) => `<div>
      <div class="arow">
        <div class="n">${esc(b.title)}<div class="s">Көрілгені: ${a.seen} / ${total} сұрақ · ${a.t} жауап</div></div>
        <div class="hbar"><i style="width:${a.pct || 0}%;background:${color(a.pct || 0)}"></i></div>
        <div class="p">${a.pct === null ? '—' : a.pct + '%'}</div>
      </div>
      <div class="lvls">${lv.map((x, i) => `<div>${LEVEL[i + 1]}: ${x.pct === null ? '—' : x.pct + '%'}</div>`).join('')}</div>
    </div>`).join('');

    $('aLevels').innerHTML = [1, 2, 3].map(l => { const a = agg(q => q.l === l); return `<div class="arow">
      <div class="n">${LEVEL[l]}<div class="s">${a.t} жауап</div></div>
      <div class="hbar"><i style="width:${a.pct || 0}%;background:${color(a.pct || 0)}"></i></div>
      <div class="p">${a.pct === null ? '—' : a.pct + '%'}</div></div>`; }).join('');

    const weak = rows.filter(x => x.a.t >= 5).sort((x, y) => x.a.pct - y.a.pct);
    const tip = $('tip');
    if (weak.length){
      const w = weak[0], lvWeak = w.lv.map((x, i) => ({...x, l: i + 1})).filter(x => x.t >= 3).sort((x, y) => x.pct - y.pct)[0];
      tip.innerHTML = `Ең әлсіз кітап: <b>${esc(w.b.title)}</b> — ${w.a.pct}% дұрыс` + (lvWeak ? `, әсіресе «${LEVEL[lvWeak.l]}» сұрақтар (${lvWeak.pct}%).` : '.') + ' Осы кітапты қайта қарап, «Қатемен жұмыс» режимін өтіңіз.';
      tip.classList.remove('hidden');
    } else tip.classList.add('hidden');

    const wrongList = Object.entries(stats).filter(([id, s]) => s.w > 0 && qById[id])
      .sort((a, b) => (b[1].w - b[1].r * .5) - (a[1].w - a[1].r * .5)).slice(0, 15);
    $('aWrong').innerHTML = wrongList.length ? wrongList.map(([id, s]) => { const q = qById[id]; return `<div class="wq">
      <div class="bookname">${esc(bookById[q.b].title)} · ${LEVEL[q.l]}</div>
      <div style="font-weight:600;margin:3px 0">${esc(q.q)}</div>
      <div class="right" style="color:var(--ok)">Дұрыс жауап: ${esc(q.a[0])}</div>
      <div class="c">Қате: ${s.w} рет · Дұрыс: ${s.r} рет</div></div>`; }).join('')
      : '<p class="note">Әзірге қате жоқ.</p>';

    const fmt = d => new Date(d).toLocaleString('ru-RU', {day:'2-digit', month:'2-digit', hour:'2-digit', minute:'2-digit'});
    $('aHist').innerHTML = hist.length ? hist.slice(0, 15).map(h => { const p = Math.round(h.r / h.n * 100); return `<div class="hist">
      <div>${h.kind === 'all' ? 'Жалпы тест' : h.kind === 'mistakes' ? 'Қатемен жұмыс' : esc((bookById[h.book] || {}).title || '')}<div class="d">${fmt(h.d)}</div></div>
      <div style="font-weight:700;color:${color(p)}">${h.r}/${h.n} · ${p}%</div></div>`; }).join('')
      : '<p class="note">Әзірге тест тапсырылмаған.</p>';
  }
  $('reset').onclick = () => {
    if (!confirm('Барлық статистиканы өшіру керек пе?')) return;
    stats = {}; hist = []; save(KEY, stats); save(HIST, hist); renderStats();
  };

  $('start').onclick = start;
  $('next').onclick = next;
  $('again').onclick = start;
  $('toHome').onclick = $('quit').onclick = () => { clearInterval(tick); setTab('home'); renderHome(); show('home'); };
  document.addEventListener('keydown', e => {
    if ($('quiz').classList.contains('hidden')) return;
    const k = {'1':0,'2':1,'3':2,'4':3}[e.key];
    if (k !== undefined) answer(k);
    else if (e.key === 'Enter' && !$('next').disabled && e.target.tagName !== 'BUTTON') next();
  });

  renderHome();
})();
</script>
</body>
</html>
